# CI del Juego de Baile (agente G, bloque B10).
# Compila y prueba lo que el entorno de desarrollo (sin red) no puede: la GDExtension con gdext,
# Godot headless y la app Android. Ver BUILD.md.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  GODOT_VERSION: "4.4.1"

jobs:
  # (a) Motor Rust: workspace engine/ (jd_core, jd_capi, jd_tools) + lógica de jd_godot sin Godot.
  engine:
    name: engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            engine/jd_godot/bridge_test -> target
      - name: cargo build (sin warnings)
        working-directory: engine
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --workspace --all-targets
      - name: cargo test
        working-directory: engine
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --workspace
      - name: cargo test (jd_godot/bridge, sin Godot)
        run: cargo test --manifest-path engine/jd_godot/bridge_test/Cargo.toml
      - name: cargo clippy (informativo; los avisos no rompen la CI)
        working-directory: engine
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

  # (b) GDExtension: biblioteca jd_godot.dll / libjd_godot.so como artefacto.
  jd_godot:
    name: jd_godot (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            lib: jd_godot.dll
            artifact: jd_godot-windows-x86_64
          - os: ubuntu-latest
            lib: libjd_godot.so
            artifact: jd_godot-linux-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine/jd_godot -> target
            engine -> target
      - name: cargo build --release (jd_godot)
        run: cargo build --release --manifest-path engine/jd_godot/Cargo.toml
      - name: cargo build --release (herramientas del motor)
        working-directory: engine
        run: cargo build --release --workspace
      - name: Preparar artefactos
        run: |
          mkdir -p dist/lib dist/game
          cp "engine/jd_godot/target/release/${{ matrix.lib }}" dist/lib/
          cp engine/jd_godot/Cargo.lock dist/lib/jd_godot.Cargo.lock
          # Juego listo para abrir con Godot 4.4: game/ + la biblioteca en game/bin/.
          cp -r game/. dist/game/
          cp "engine/jd_godot/target/release/${{ matrix.lib }}" dist/game/bin/
          mkdir -p dist/tools
          for b in jd_record phone_sim jd_judge; do
            for f in "engine/target/release/$b" "engine/target/release/$b.exe"; do
              if [ -f "$f" ]; then cp "$f" dist/tools/; fi
            done
          done
          ls -R dist | head -100
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/lib/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: juego-${{ matrix.artifact }}
          path: |
            dist/game/
            dist/tools/
          if-no-files-found: error

  # (c) Python: prototipo, herramientas de coreografía y pruebas de sistema.
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Instalar numpy, pytest y ffmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: pytest
        run: |
          # Una ejecución por carpeta: evita choques de nombres de módulo entre carpetas sin __init__.py.
          status=0
          for d in proto/dev_tests proto/tests tools/tests tests/system/tests; do
            if [ -d "$d" ]; then
              echo "::group::pytest $d"
              rc=0
              python -m pytest -q "$d" || rc=$?
              # 5 = no se recogió ningún test (carpeta aún vacía): no es un fallo.
              if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then status=1; fi
              echo "::endgroup::"
            else
              echo "(no existe $d; se omite)"
            fi
          done
          exit $status

  # (d) Godot headless: carga la GDExtension y ejecuta los tests de GDScript (agente T2).
  godot:
    name: godot headless
    needs: jd_godot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jd_godot-linux-x86_64
          path: dl
      - name: Copiar libjd_godot.so a game/bin
        run: |
          mkdir -p game/bin
          cp dl/libjd_godot.so game/bin/
      - name: Cache de Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Descargar Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          cd ~/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
      - name: Importar el proyecto (genera .godot/extension_list.cfg)
        run: |
          ~/godot/godot --version
          # --import: abre el editor sin ventana, importa y sale. Si esta versión no lo tuviera, se
          # usa --editor --quit-after.
          timeout 300 ~/godot/godot --headless --path game --import \
            || timeout 300 ~/godot/godot --headless --path game --editor --quit-after 600 \
            || true
          echo "--- game/.godot/extension_list.cfg:"
          cat game/.godot/extension_list.cfg || echo "(no se generó)"
      - name: Prueba de humo de la GDExtension
        run: |
          cp scripts/ci/check_extension.gd game/_ci_check_extension.gd
          timeout 120 ~/godot/godot --headless --path game -s res://_ci_check_extension.gd -- "$GITHUB_WORKSPACE/data"
      - name: Tests de GDScript (game/tests/run_tests.gd)
        run: |
          if [ -f game/tests/run_tests.gd ]; then
            timeout 600 ~/godot/godot --headless --path game -s res://tests/run_tests.gd
          else
            echo "No existe game/tests/run_tests.gd todavía (agente T2); se omite."
          fi

  # (e) App Android de mando: APK de depuración como artefacto (si existe android/gradlew).
  android:
    name: android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ¿Existe android/gradlew?
        id: check
        run: |
          if [ -f android/gradlew ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No existe android/gradlew (agente P); se omite."; fi
      - uses: actions/setup-java@v4
        if: steps.check.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        if: steps.check.outputs.present == 'true'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.present == 'true'
      - name: ./gradlew assembleDebug testDebugUnitTest
        if: steps.check.outputs.present == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.present == 'true'
        with:
          name: mando-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.present == 'true'
        with:
          name: mando-android-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
